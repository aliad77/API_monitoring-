# Temporary: runs Node tooling on GitHub (not locally), commits the results
# back to this branch for review. Never merged into main.
name: Bootstrap (temporary)

on:
  push:
    branches: [ci/bootstrap]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pulse:pulse@localhost:5432/pulse_test
      TEST_DATABASE_URL: postgresql://pulse:pulse@localhost:5432/pulse_test
      AUTH_SECRET: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install and generate lockfile
        run: |
          node --version > /tmp/versions.txt
          npm --version >> /tmp/versions.txt
          npm install --no-audit --no-fund 2>&1 | tail -20 > /tmp/install.txt
      - name: Prettier diagnosis, then format
        run: |
          set +e
          npx prettier --check . > /tmp/prettier-before.txt 2>&1
          echo "exit=$?" >> /tmp/prettier-before.txt
          npx prettier --write . > /tmp/prettier-write.txt 2>&1
          git add -A -- . ':!package-lock.json'
          git commit -m "style: apply Prettier formatting" || true
          git add package-lock.json
          git commit -m "chore: add package-lock.json generated by npm install" || true
      - name: Run checks and record output
        run: |
          set +e
          mkdir -p ci-reports
          cp /tmp/versions.txt /tmp/install.txt /tmp/prettier-before.txt /tmp/prettier-write.txt ci-reports/
          npx prettier --check . > ci-reports/prettier-after.txt 2>&1; echo "exit=$?" >> ci-reports/prettier-after.txt
          npm run lint > ci-reports/lint.txt 2>&1; echo "exit=$?" >> ci-reports/lint.txt
          npm run typecheck > ci-reports/typecheck.txt 2>&1; echo "exit=$?" >> ci-reports/typecheck.txt
          npm run db:deploy > ci-reports/db-deploy.txt 2>&1; echo "exit=$?" >> ci-reports/db-deploy.txt
          npx vitest run --reporter=default --reporter=json --outputFile=ci-reports/vitest.json > ci-reports/test.txt 2>&1; echo "exit=$?" >> ci-reports/test.txt
          npm ci --dry-run > ci-reports/npm-ci-dry-run.txt 2>&1; echo "exit=$?" >> ci-reports/npm-ci-dry-run.txt
          git add ci-reports
          git commit -m "chore: record bootstrap check output"
          git push origin HEAD:ci/bootstrap
